<script>
'use strict';
let report=JSON.parse(document.getElementById('report-data').textContent);
function restoreSources(value){if(value.source_snippets)for(const error of value.errors)for(const stack of error.stacks)for(const frame of stack.frames)if(Number.isInteger(frame.source_ref))frame.source=value.source_snippets[frame.source_ref];return value}
restoreSources(report);
let countPrefix=report.counts_complete===false?'至少 ':'';
const $=id=>document.getElementById(id);
const labels={InvalidRead:'非法读取',InvalidWrite:'非法写入',InvalidFree:'非法释放',MismatchedFree:'释放方式不匹配',UninitCondition:'未初始化条件',UninitValue:'未初始化值',Overlap:'内存区域重叠',SyscallParam:'系统调用参数',Leak_DefinitelyLost:'确定泄漏',Leak_IndirectlyLost:'间接泄漏',Leak_PossiblyLost:'可能泄漏',Leak_StillReachable:'仍可访问',FishyValue:'可疑参数值'};
let kind='',selected=null,busy=false,visibleLimit=100,showBlame=true;
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const typeName=k=>labels[k]||k;
const position=f=>f.file?f.file+(f.line?':'+f.line:''):(f.fn||f.obj||'无符号位置');
const shellQuote=s=>/^[A-Za-z0-9_@%+=:,./-]+$/.test(s)?s:'"'+s.replace(/[\\"$`]/g,'\\$&')+'"';
const normalize=s=>String(s||'').replace(/\\/g,'/').toLowerCase();
let indexed=[],kindCounts=new Map();
function errorAuthor(e){const frame=e.stacks[0]?.frames[0];const author=frame?.source?.find(row=>row.number===Number(frame.line))?.blame?.author;return author?'author:'+author:'missing'}
function authorOptions(){
 const select=$('authorFilter'),previous=select.value,counts=new Map();
 for(const row of indexed)counts.set(row.author,(counts.get(row.author)||0)+(row.e.kind==='Leak_StillReachable'?0:1));
 const name=author=>author==='missing'?'\u65e0\u4f5c\u8005\u4fe1\u606f':author.slice(7);
 if(previous&&!counts.has(previous))counts.set(previous,0);
 const authors=[...counts.keys()].sort((a,b)=>counts.get(b)-counts.get(a)||name(a).localeCompare(name(b),'zh-CN'));
 select.replaceChildren(new Option('\u5168\u90e8\u4f5c\u8005 ('+[...counts.values()].reduce((sum,count)=>sum+count,0)+')',''));
 for(const author of authors)select.append(new Option(name(author)+' ('+counts.get(author)+')',author));
 select.value=previous||'';
}

function indexReport(){indexed=report.errors.map((e,index)=>{const frames=e.stacks.flatMap(s=>s.frames);const files=frames.flatMap(f=>[f.file,f.local_file,f.file?(f.dir?f.dir.replace(/[\\/]$/,'')+'/':'')+f.file:'']).filter(Boolean);return {e,index,author:errorAuthor(e),files:files.map(normalize),text:normalize([e.kind,typeName(e.kind),e.what,e.id,...files,...frames.flatMap(f=>[f.fn,f.obj])].join(' '))}});kindCounts=new Map();for(const e of report.errors)kindCounts.set(e.kind,(kindCounts.get(e.kind)||0)+1);authorOptions()}
indexReport();
let filtered=[];
function selectError(e){selected=e.id;for(const b of $('list').children)if(b.dataset.errorId)b.setAttribute('aria-current',String(b.dataset.errorId===selected));detail(e);try{history.replaceState(null,'','#'+e.id)}catch{}if(innerWidth<1100)$('detail').scrollIntoView({behavior:'auto'})}
function matchingRows(){const query=normalize($('search').value.trim()),file=normalize($('fileFilter').value.trim());return indexed.filter(row=>(!$('authorFilter').value||row.author===$('authorFilter').value)&&row.text.includes(query)&&(!file||row.files.some(path=>path.includes(file))))}
function nav(){
 const totals=new Map();for(const e of report.errors)totals.set(e.kind,(totals.get(e.kind)||0)+1);const matching=matchingRows();kindCounts=new Map();for(const row of matching)kindCounts.set(row.e.kind,(kindCounts.get(row.e.kind)||0)+1);
 $('nav').replaceChildren();
 const kinds=['',...new Set(report.errors.map(e=>e.kind))];
 for(const k of kinds){const b=el('button');if(['InvalidRead','InvalidWrite','Leak_DefinitelyLost'].includes(k))b.className='danger-kind';b.append(el('span',k?typeName(k):'全部问题'),el('span',String(k?(kindCounts.get(k)||0):matching.length)+'/'+String(k?totals.get(k):report.errors.length),'type-count'));b.setAttribute('aria-current',String(k===kind));b.onclick=()=>{kind=k;nav();list()};$('nav').append(b)}
}
function openSourceFile(frame){
 const file=report.source_files?.[frame.source_file_id];if(!file)return;
 window.open(file.url+'#L'+Number(frame.line),'_blank','noopener,noreferrer');
}
function list(reset=true){
 if(reset){visibleLimit=100;filtered=matchingRows().filter(row=>!kind||row.e.kind===kind);nav();}
 const errors=filtered.map(row=>row.e);
 $('listCount').textContent='共 '+report.errors.length+' 个错误位置 · 筛选后 '+errors.length+' 个 · 已显示 '+Math.min(visibleLimit,errors.length)+' 个 · '+countPrefix+errors.reduce((n,e)=>n+e.count,0)+' 次记录';$('list').replaceChildren();
 for(const {e,index} of filtered.slice(0,visibleLimit)){const b=el('button',undefined,'issue');b.dataset.errorId=e.id;b.setAttribute('aria-current',String(e.id===selected));const t=el('span',undefined,'type');t.append(el('span','第 '+(index+1)+' 条 · '+e.kind),el('span','× '+countPrefix+e.count));b.append(t,el('strong',e.what));const frames=e.stacks[0]?.frames||[];const f=frames.find(f=>f.local_file)||frames.find(f=>f.file)||frames[0];b.append(el('small',f?position(f):'无调用栈'));b.onclick=()=>selectError(e);$('list').append(b)}
 if(errors.length>visibleLimit){const more=el('button','显示后 100 条','secondary');more.onclick=()=>{visibleLimit+=100;list(false)};$('list').append(more)}
 if(!errors.length)$('list').append(el('div',report.errors.length?'没有匹配项，试试其他类型或关键词。':'XML 中没有内存错误。','empty'));
 if(selected&&!errors.some(e=>e.id===selected)){selected=null;$('detail').replaceChildren(el('div','选择当前列表中的错误以查看详情。','empty'))}
}
let activeDetail=null;const expandedFrames=new Map();
function rememberDetail(){if(!activeDetail)return;const states=new Map();for(const child of $('detail').children)if(child.dataset?.frameKey)states.set(child.dataset.frameKey,child.open);if(states.size){expandedFrames.set(activeDetail,states);if(expandedFrames.size>100)expandedFrames.delete(expandedFrames.keys().next().value)}}
function detail(e){
